site_name: Lab DevSecOps (exercices)
site_description: Une chaîne CI/CD GitHub Actions + Terraform qui bloque les changements vulnérables, avec des outils gratuits.
docs_dir: docs
strict: true

theme:
  name: material
  language: fr
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Mode sombre }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Mode clair }

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Accueil: index.md
  - Parcours:
      - "1. Pipeline minimal": etapes/01-pipeline-minimal.md
      - "2. Build, tests, Docker": etapes/02-build-test-docker.md
      - "3. Secrets": etapes/03-secrets.md
      - "4. SAST et SCA": etapes/04-sast-sca.md
      - "5. Image": etapes/05-image.md
      - "6. Terraform": etapes/06-terraform.md
      - "7. Scan IaC et policies": etapes/07-iac-policies.md
      - "8. Quality gates": etapes/08-quality-gates.md
      - "9. Protection de branche": etapes/09-branch-protection.md
      - "10. OIDC, apply, destroy": etapes/10-oidc-deploy.md
      - "11. SBOM et Prowler": etapes/11-prowler-sbom.md
  - Journal de bord: journal.md
  - Référence:
      - "Correspondance Wiz": reference/mapping-wiz.md
      - "Limites face à Wiz": reference/limites.md
  - Après le parcours:
      - "Audit du lab d'origine": 00-audit.md
      - "ADR 0001 Architecture": adr/0001-architecture.md
      - "ADR 0002 Outils": adr/0002-outils.md
      - "ADR 0003 Seuils et exceptions": adr/0003-gates-et-exceptions.md
