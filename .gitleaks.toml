# Configuration Gitleaks du lab.
# On garde toutes les règles par défaut et on ajoute un format de jeton "maison".
title = "devsecops-lab"

[extend]
useDefault = true

# Règle personnalisée : beaucoup d'entreprises ont des jetons internes qu'aucun
# scanner ne connaît. Ce format fictif sert aussi de secret de démonstration :
# il est manifestement faux et ne correspond à aucun fournisseur réel.
[[rules]]
id = "lab-fake-token"
description = "Jeton factice du lab (format interne fictif)"
regex = '''LABFAKE_[A-Z0-9]{24}'''
keywords = ["labfake_"]
