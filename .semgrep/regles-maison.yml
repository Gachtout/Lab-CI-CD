# Règles maison : la politique interne traduite en contrôles automatiques.
# Elles s'ajoutent aux jeux de règles communautaires p/python et p/flask.
rules:
  - id: interdit-flask-debug
    languages: [python]
    severity: ERROR
    message: >-
      Le mode debug de Flask expose une console d'exécution de code à distance.
      Il ne doit jamais être activé en dur.
    pattern-either:
      - pattern: $APP.run(..., debug=True, ...)
      - pattern: $APP.config["DEBUG"] = True

  - id: interdit-secret-en-dur
    languages: [python]
    severity: ERROR
    message: >-
      Un secret de configuration doit venir de l'environnement ou d'un coffre,
      jamais d'une chaîne littérale.
    patterns:
      - pattern: $APP.config[$CLE] = "..."
      - metavariable-regex:
          metavariable: $CLE
          regex: (?i).*(token|secret|password|key).*
