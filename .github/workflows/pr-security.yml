# Contrôles de sécurité sur chaque pull request et sur main.
# Chaque job appelle une cible du Makefile : le même outil, la même image, le même seuil qu'en local.
name: pr-security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Aucun droit par défaut : chaque job déclare le strict nécessaire.
permissions: {}

# Un nouveau push sur la même PR annule l'exécution précédente.
concurrency:
  group: pr-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Vérifier les workflows (actionlint)
        run: make lint-workflows
      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: actionlint
          path: reports/actionlint.txt
          retention-days: 7

  build-test:
    name: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests unitaires
        run: make test
      - name: Construire l'image
        run: make build

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write # publier le SARIF dans Code Scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tout l'historique : un secret supprimé reste dans git
      - name: Chercher des secrets (Gitleaks)
        run: make secrets
      - name: Publier dans Code Scanning
        # Le jeton d'une PR venant d'un fork est en lecture seule : on n'essaie pas.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: reports/gitleaks.sarif
          category: gitleaks
      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-secrets
          path: reports/
          retention-days: 7

  sast:
    name: sast
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Analyse statique (Semgrep)
        run: make sast
      - name: Publier dans Code Scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: reports/semgrep.sarif
          category: semgrep
      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-sast
          path: reports/
          retention-days: 7

  sca:
    name: sca
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dépendances vulnérables (Trivy)
        run: make sca
      - name: Publier dans Code Scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: reports/trivy-sca.sarif
          category: trivy-sca
      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-sca
          path: reports/
          retention-days: 7

  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construire l'image
        run: make build
      - name: Scanner l'image (Trivy)
        run: make image-scan
      - name: Publier dans Code Scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: reports/trivy-image.sarif
          category: trivy-image
      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-image
          path: reports/
          retention-days: 7
