# Sur chaque pull request : format, validation et plan Terraform.
# Le plan est fait hors ligne (aucun identifiant AWS) : il fonctionne aussi pour une PR venant d'un fork.
name: terraform-plan

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # commenter la PR avec le résumé du plan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format
        run: make tf-fmt
      - name: Validation
        run: make tf-validate
      - name: Plan hors ligne
        run: make plan
      - name: Résumer le plan
        if: always()
        run: |
          {
            echo '### Terraform : plan hors ligne'
            echo
            echo '```text'
            grep -E 'will be|must be|Plan:|No changes' reports/tfplan.txt || echo 'Plan indisponible : voir les logs du job.'
            echo '```'
          } > reports/plan-comment.md
          cat reports/plan-comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commenter la PR
        # Le jeton d'une PR venant d'un fork est en lecture seule : on n'essaie pas.
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/pr-comment.sh plan reports/plan-comment.md
      - name: Conserver le plan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-plan
          path: reports/
          retention-days: 7
