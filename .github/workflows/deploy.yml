# Déploiement sur AWS : plan en lecture seule, approbation manuelle, puis apply.
# Aucune clé AWS n'est stockée : chaque job échange un jeton OIDC contre des identifiants d'une heure.
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

# Jamais deux déploiements en parallèle, et on n'interrompt pas un apply en cours.
concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_app_permissions_boundary_arn: ${{ vars.APP_BOUNDARY_ARN }}

jobs:
  plan:
    name: plan-aws
    # Tant que le bootstrap AWS n'est pas fait, le workflow ne fait rien au lieu d'échouer.
    if: vars.AWS_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dev-plan
    permissions:
      contents: read
      id-token: write # demander le jeton OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Identifiants AWS temporaires (rôle de plan, lecture seule)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}
      - name: Plan
        run: make aws-plan
      - name: Publier le plan pour l'approbateur
        if: always()
        run: |
          {
            echo '### Plan Terraform à approuver'
            echo
            echo '```text'
            grep -E 'will be|must be|Plan:|No changes' reports/aws-plan.txt || echo 'Plan indisponible : voir les logs du job.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: apply
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # L'environnement "dev" exige une approbation : le job attend, sans identifiants, qu'un humain valide.
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Identifiants AWS temporaires (rôle de déploiement)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-apply-${{ github.run_id }}
      - name: Apply
        env:
          AWS_CONFIRM: oui
        run: make aws-apply
