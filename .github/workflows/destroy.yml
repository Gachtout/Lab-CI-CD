# Destruction de l'environnement dev. Lancement manuel uniquement, avec confirmation et approbation.
name: destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Tape "destroy" pour confirmer la suppression de toutes les ressources de dev'
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_app_permissions_boundary_arn: ${{ vars.APP_BOUNDARY_ARN }}

jobs:
  destroy:
    name: destroy
    if: inputs.confirmation == 'destroy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Identifiants AWS temporaires (rôle de déploiement)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-destroy-${{ github.run_id }}
      - name: Destroy
        env:
          AWS_CONFIRM: oui
        run: make aws-destroy
